<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climb the tree — Deer Pine Chalet</title>
  <meta name="description" content="Start at the roots and scroll up to climb: everything about the stay, hung on the branches of a tall pine.">
  <meta name="theme-color" content="#1e3a2b">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="tree-page">

<header class="site-header">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 4 15h4v13h16V15h4z" fill="#f2a93b"/><path d="M13 28v-7h6v7" fill="#1e3a2b"/></svg>
    <span data-bind="name">Deer Pine Chalet</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="index.html" class="nav-alt">Home</a>
    <a href="tree.html" aria-current="page">Climb the tree</a>
    <a class="nav-book" data-bind="airbnb" href="#">Book</a>
  </nav>
</header>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="leaves" aria-hidden="true"></canvas>

<main class="climb" id="climb">
  <h1 class="sr-only">Climb the tree: the stay from roots to treetop</h1>
  <div class="trunk" id="trunk" aria-hidden="true"></div>

  <!-- Treetop stop is rendered here -->
  <div id="topStops"></div>

  <div class="crown" aria-hidden="true">
    <svg viewBox="0 0 900 560">
      <g fill="#24472f">
        <path d="M450 20 L300 230 H360 L220 400 H300 L140 560 H760 L600 400 H680 L540 230 H600Z"/>
      </g>
      <g fill="#2f5a3c">
        <path d="M450 60 L340 230 H390 L280 380 H340 L220 520 H450Z"/>
      </g>
      <g fill="#f2a93b">
        <circle cx="430" cy="210" r="6"/><circle cx="520" cy="330" r="5"/><circle cx="360" cy="440" r="6"/><circle cx="600" cy="480" r="5"/>
      </g>
    </svg>
  </div>

  <!-- Branch stops (crown to first branch) are rendered here -->
  <div id="branchStops"></div>

  <section class="ground" id="ground" aria-label="Ground level">
    <svg class="roots" viewBox="0 0 760 500" aria-hidden="true" fill="none" stroke="#5a3f2c" stroke-linecap="round">
      <path d="M380 0 C370 120 300 180 180 260 C120 300 80 360 40 420" stroke-width="18"/>
      <path d="M380 0 C390 140 470 200 590 270 C650 310 700 370 730 440" stroke-width="18"/>
      <path d="M380 0 C380 160 360 280 370 480" stroke-width="22"/>
      <path d="M260 210 C230 250 220 320 240 380" stroke-width="8"/>
      <path d="M500 220 C540 260 550 320 530 390" stroke-width="8"/>
      <path d="M370 300 C330 340 300 360 260 450" stroke-width="7"/>
      <path d="M372 320 C420 360 450 380 480 460" stroke-width="7"/>
    </svg>
    <div id="rootStop"></div>
    <p class="ground-hint" id="hint">
      <svg class="arrow" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 24V4M5 12l9-9 9 9" stroke="#b7c49a" stroke-width="3" fill="none"/></svg>
      Scroll up to climb
    </p>
  </section>
</main>

<aside class="altimeter" aria-label="Climb progress">
  <div class="alt-track"><div class="alt-fill"></div><div class="alt-climber"></div></div>
  <ul class="alt-labels" id="altLabels"></ul>
</aside>
<div class="alt-readout" id="readout" aria-live="off">Roots</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/tree.js"></script>
</body>
</html>
